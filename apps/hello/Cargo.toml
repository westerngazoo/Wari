[package]
name = "wari-hello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The Tier-1 WASM 'hello world' — Phase 0 exit demo."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Manifest declaration (Phase 2 dynamic loading): the embedded
# `wari_driver_manifest` section that `scripts/sign-module` cross-checks
# against this binary's real import/export surface before signing.
wari-driver-iface = { path = "../../driver-iface" }
# Phase 0: hand-rolled WASI bindings live inline in `src/lib.rs` (one
# `extern "C"` block). When the WASI surface grows past `fd_write` +
# `proc_exit` (Phase 1), this slot gets a real binding crate.
#
# Phase 2 agentic PoC: the AI-OS Executor's mediation policy is the pure
# `wari-policy` gauntlet. Linked into this demo (wasm32-clean, zero deps)
# so the Executor role can run `evaluate(req, budget)` in-module — the
# first agentic brick. See docs/ai-os-assistant-design.md §5.
wari-policy = { path = "../../wari-policy" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
